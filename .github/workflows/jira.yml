name: JIRA Connection
on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
jobs:
  enforce-issue:
    runs-on: ubuntu-latest
    name: JIRA Association
    steps:
      - name: Check for JIRA ISSUE
        id: check
        uses: supplypike/jira-pr-link-action@310c2a824889fb3c9e48cc91874ee46e44247ed5 # v5.0.1
        with:
          ignore-author: |
            dependabot[bot]
            supplypiker
          project: "(SRENEW|SRENEW)"
          jira-host: ${{ secrets.JIRA_HOST }}
          jira-email: ${{ secrets.JIRA_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
