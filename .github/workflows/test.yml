name: 'build-test'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: 'npm'
      - run: |
          npm ci
      - run: |
          npm run all
      - uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        if: ${{ github.actor != 'dependabot[bot]' }}
        with:
          args: >
            -D sonar.projectKey=supplypike_flux-pr-env-action
            -D sonar.projectName=flux-pr-env-action
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  test: # make sure the action works on a clean machine without building
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 'Create cluster'
        uses: AbsaOSS/k3d-action@ad80fda285ceeca9b1ebef8c4b3f862f8b9124b4 # v2.4.0
        with:
          cluster-name: 'test-cluster-1'
          args: --agents 1
      - name: Testing
        run: |
          kubectl cluster-info
          kubectl get pods -n kube-system
          echo "current-context:" $(kubectl config current-context)
          echo "environment-kubeconfig:" ${KUBECONFIG}
      - name: Install Flux binary
        uses: supplypike/setup-bin@8365380a806a88e7a0f0d07059b175ca2f5418d7 # v5.0.1
        with:
          uri: 'https://github.com/fluxcd/flux2/releases/download/v2.2.2/flux_2.2.2_linux_amd64.tar.gz'
          name: 'flux'
          version: '2.2.2'
      - name: Dev-install of flux to cluster
        run: |
          flux install
      - run: |
          kubectl create namespace previews
      - uses: ./
        with:
          namespace: previews
          skipCheck: true
